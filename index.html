<script>
/* MicroLED end-to-end link simulator — single-tab build.
   Extracted from the MicroLED Sim Lab (v340 engine).
   Shared-helper block (parameter defaults, slider, diskOverlap, heatRGB) restored from v336. */

/* µLED L-I (papers): P = kLI * I^nLI (uW, I in mA). No threshold; sub-linear from droop.
   Calibrated to 80uW @ 1.5mA (PTL2025/HotI2025 Fig4). nLI<1 = droop steepness. */
function liP(I,nLI){const k=80/Math.pow(1.5,nLI);return k*Math.pow(Math.max(I,0),nLI);}
const P={ledTailPs:250, pmSub:0, rdThr:1, rdLight:1, r3Yaw:28, r3Pit:18, r3Rays:14, r3Zoom:1, r3Len:2, r3Show:1, Rb:4,ER:6.5,ledBW:3,rxBW:3,dlam:16,reach:5,Dcd:450,snr:22,txsnr:40,ledTail:0.25,ledTailUI:1.0,peak:0,taps:1,sps:12,Nsym:2200,xt:-22,K:6,cmFrac:0.8,cmrr:25,irn:5,Prx:-12, R:0.33,inA:1,M:10,F:2, J:1000,Tc:200,tnr:2.0,Bn:0.8, Ibias:2.0,Iswing:3.0,nLI:0.75,tgain:40,apdM:1,aging:15,Ttel:45,fleetSpread:25,asym:2.0,txpk:3,rxpk:0,peakCost:0.3, oside:'rx',arr:'2d',collim:70,trench:3.0,pitchXt:50,thermXt:0, cfg:'1pd',pdD:30,lensD:50,dtiRefl:55,dtiH:0,pdGap:4,aspect:2,fiberCore:50,lensGap:0,nbr:6,txCup:60,emD:6,fiberNA:0.22, txOff:0, thOut:12, sreach:5, xtk:3.5, nAgg:6, qtgt:5.2,dbiB:0, cdRb:4, zStand:30, inPitch:20, dfeTap:100, dfeTau:0.15, dfeSkew:0, fibNA:0.2, linkNA:0.2, dfe1:0, fbAlpha:99, fbCoreR:25, fbClad:12, fbNA:0.2, fbLam:430, fbLen:5, fbL:3, fbM:1, lutOn:10, lutW:1, lutRx:0, lutWx:1, rxDet:0, pdGap2:4, cmFrac:0.8, cmrr:25, irnFc:12, rxDet:0, thrOpt:0, pLed:80, ledSlow:0.35, ledArea:28, fibAtt:0.06, prxAuto:1, th50:5.5, dispSub:0, eqSub:0};
function slider(key,label,min,max,step){return `<div class="ctl"><label>${label}<b id="v_${key}">${P[key]}</b></label><input type="range" id="s_${key}" min="${min}" max="${max}" step="${step}" value="${P[key]}"></div>`;}

function telem(aging,T,bias,Rb,ledBW0){
  // 1st-order TX telemetry drift: ER/VECP/eye-margin vs aging (WPE droop), junction temp, bias. Phenomenological.
  const lifeK=50, ER0=7, VECP0=0.5;                       // rated life 50kh, fresh ER 7dB
  const tFac=1-0.005*(T-25);                              // efficiency vs temp
  const bFac=Math.min(1.2,0.6+0.4*(bias/2));              // bias raises OMA, saturating
  const OMArel=Math.max(0.15,(1-0.35*(aging/lifeK))*tFac*bFac);   // relative OMA (aging droop + temp + bias)
  const ER=ER0*OMArel;                                    // ER tracks OMA
  const ledBWeff=ledBW0*(1-0.004*(T-25))*Math.min(1.3,0.7+0.3*(bias/2));  // LED slower when hot
  const isi=Math.pow(Rb/(6.5*Math.max(ledBWeff,0.3)),2);  // eye closure from ISI (assumes nominal peaking)
  const VECP=VECP0+4*isi+2.2*(1-OMArel);                  // vertical eye closure penalty (dB)
  const eyeH=100*OMArel, eyeW=100*Math.max(0,1-1.2*isi);  // relative eye height/width (%)
  const ERspec=3, VECPspec=5, eyeSpec=35;
  const mER=(ER-ERspec)/(ER0-ERspec), mV=(VECPspec-VECP)/(VECPspec-VECP0), mE=(Math.min(eyeH,eyeW)-eyeSpec)/(100-eyeSpec);
  const health=100*Math.max(0,Math.min(1,Math.min(mER,mV,mE)));
  return {ER,VECP,eyeH,eyeW,health,ledBWeff};
}
const CDNOTE='<b>CD, spectrum, eye and reach in one view.</b> Chromatic dispersion here is an <b>incoherent linear low-pass</b> (verified against a field CD-transfer + square-law sim, correlation 1.0000 &mdash; no fading nulls). The <b>spectrum</b> panel shows it: the Tx signal rolls off at HF after CD (red), and <b>analog peaking (CTLE)</b> boosts HF back (blue). Because the channel is linear a CTLE response inverts it &mdash; this is <b>continuous analog peaking</b>, not a tapped-delay FFE. Walk-off Δτ = D·L·Δλ (D≈450 ps/nm·km at blue); magnitude calibrated to Avicena <b>Fig 8</b> (30 m @ 3.2 Gbaud, 10 nm → Δτ/UI≈0.43). The <b>eye</b> is the same signal after CD+peaking with RX noise; <b>BER-vs-reach</b> compares no-peaking vs analog peaking against the <b>cross-channel-ECC pre-threshold (~1e-7)</b> &mdash; spatial XOR parity across lanes (pre ~1e-7 &rarr; post ~1e-12), not KP4&#39;s 2e-4. µLED gain is low so raw BER must already be good; telemetry that flags a failed lane turns error-correction into erasure-correction, cutting both BER and the redundancy overhead. Grouping across the whole array (hundreds of lanes) keeps overhead to a <b>few %</b> (sub-1% for pure erasure/spare) &mdash; but a larger codeword needs a <b>better raw BER</b> (pre-threshold drops toward ~1e-8), which is why µLED links target 1e-9 to 1e-12 raw. Reach lever is <b>narrower Δλ</b> (CD linear in Δλ), not just more peaking &mdash; peaking is bounded by the matched-filter limit.';
const CDLPNOTE='<b>Chromatic dispersion as a low-pass filter (incoherent source).</b> Each wavelength travels at its own group velocity, so it arrives with a wavelength-dependent delay <b>τ(λ) = D·L·(λ−λ₀)</b>. Because an LED is <b>incoherent</b>, the detected intensity is the sum of these delayed copies weighted by the spectrum — so the intensity impulse response is just the spectrum re-mapped to time: <b>h(t) = S(λ₀ + t/DL) / |DL|</b>, RMS width <b>σ_t = D·L·σ_λ</b> (FWHM spread Δt = D·L·Δλ). Its transform is a <b>smooth, positive low-pass</b>; for a Gaussian spectrum <b>|H(f)| = exp(−(2πf·σ_t)²/2)</b>, with <b>f₃dB ≈ 0.13/σ_t</b> (σ_t in ns → GHz). Because intensities add (not fields), H(f) has <b>no nulls</b> — it is monotonic and invertible, so analog peaking can flatten it: a <b>SOFT limit</b>, bounded only by SNR and swing (the required boost grows exponentially with dispersion). A <b>coherent</b> source beats field-wise and produces <b>power-fading nulls</b> where H(f)=0 — those cannot be equalized (a <b>HARD limit</b>). This is why a broadband µLED turns CD into an easy, invertible roll-off — and why reach in the CD-limited regime is set by the electronics (SNR + swing), until modal dispersion (also null-producing) takes over. First-order Gaussian model.';
const TXRXNOTE='<b>Co-optimizing TX pre-emphasis + RX peaking.</b> Real links split the equalization across both ends &mdash; the chart shows no-EQ, TX-only, RX-only, and <b>TX+RX</b> together. Each equalizer has a <b>convex cost</b>: <b>TX pre-emph</b> flattens before the channel/noise (no noise coloring) but spends <b>OMA</b> (modelled as <b>0.5 dB SNR per dB of peaking</b>, from peak-limited drive; the ER penalty tracks it <b>linearly</b> (ER_dB drops ~1:1 with OMA loss, matching hardware experience) &mdash; push it too far and it over-equalizes and collapses the eye (watch TX-only die at high setting). <b>RX in-TIA peaking</b> costs no OMA but colors noise toward the matched-filter bound. Because both costs are convex, the optimum is an <b>interior split</b>, not a corner &mdash; a moderate TX pre-emph handling the bulk plus a light RX peaking mopping up the residual beats maxing either alone. Tune both sliders and watch the <b>TX+RX</b> curve reach furthest. The <b>red line is the cross-channel-ECC limit</b> (pre ~1e-7 &rarr; post ~1e-12; <b>not</b> KP4&#39;s 2e-4 &mdash; µLED uses spatial XOR parity across lanes, not RS-FEC in a SerDes): below it the link is dead no matter the EQ &mdash; at severe CD everything crosses under it, so the real levers there are <b>narrower Δλ</b> (cut the walk-off at the source) or a <b>nonlinear DFE</b> (beats the linear bound), not more linear peaking.';
const RXCOLNOTE='<b>Fill factor</b> = fraction of the beam\'s optical power that lands on the PD = overlap(beam, PD) / beam area (≈ (PD/beam)² when the PD is smaller than the beam). <b>Coupling loss (dB) = −10·log10(fill factor)</b> — e.g. fill 50% → 3 dB, 25% → 6 dB, 10% → 10 dB. Here a TIR ±12° lens sits a fixed 30 µm above the PD, so beam Ø = D_lens + 2·30·tan(θ), where θ is set by etendue (A_lens·sin²θ = const, so a smaller lens forces a WIDER output angle). Shrinking the lens does not keep shrinking the beam — there is an etendue-optimal lens size that minimises the beam (maximises fill); too big or too small both hurt. Total fill also includes the RX lens capture (~90% of the fiber-NA output — easier than the emitter Lambertian, so higher than TX) and a cover factor (the lens must be ≥ the fiber core to gather all of it). A neighbour lane\'s beam spilling onto this PD is <b>optical crosstalk</b> (summed over N neighbours; 2-D arrays have 4-6). <b>DTI walls do double duty:</b> taller, more reflective walls funnel rim light onto the own PD (fill up) and reflect the neighbour spill back into its own lane (crosstalk down) — both scale with reflectivity × height, bounded by wall reflectivity and etendue. Lenses are packed edge-to-edge so pitch = lens size (always adjacent); each PD sits under a lens (PD ≤ lens). In 2-PD mode the pair pitch = PD + gap (adjustable); the lens is forced ≥ 2·PD + gap so the pair fits under it. This gap is the matching-critical dimension for the differential front-end. Find optimum sweeps PD/gap/DTI and lens (bounded 25-50 µm, i.e. realistic fibre pitch) for max fill with crosstalk below the chosen target. Lens-to-lens gap models the array <b>fill factor</b> (dead zone between adjacent microlenses): a larger gap pushes neighbour beams farther apart so <b>crosstalk falls</b>, but it <b>lowers lane density</b> — it does not change a lane\'s own collection. First-order geometry, not a ray-trace. <b>SPIE anchor (Song et al., FDTD):</b> <b>lateral offset</b> (their term: in-plane misalignment between the &micro;LED and its fiber core) shows a plateau then gradual roll-off, tolerance scaling with core size &mdash; the offset knob here reproduces that shape from disk overlap (normalized geometry, NOT their absolute %: their regime is lens-less butt coupling at &micro;m <b>gap distance</b> on 3-9&micro;m cores; our standoff sits after the TIR collimator, so only the shape transfers and their gap-distance curve is deliberately NOT imported). Adhesive filling (their Strategy 3) is omitted: at our polymer-1.5/silica-1.465 interfaces it is worth only ~0.33 dB per end, unlike their GaN-to-air case.';
const TXLAUNCHNOTE='<b>TX launch with a TIR &plusmn;12&deg; microlens on the emitter.</b> The lens is etendue-matched to the emitter: D_lens = D_emitter / sin(12&deg;) (~4.8&times; the emitter, so a 6&micro;m emitter needs only a ~29&micro;m lens). The &plusmn;12&deg; beam grows to D_lens + 2&middot;30&middot;tan(12&deg;) at the fiber face; if it fits within the fiber core, spatial coupling is ~100%. <b>Launch = spatial fit &times; lens capture (~85% of the Lambertian emission) &times; angular acceptance (fiber NA vs &plusmn;12&deg;).</b> Because the emitter is small (6&micro;m = tiny etendue) and the fiber is large (50&micro;m), <b>TX is etendue-EASY</b> &mdash; launch is high (~1 dB), the opposite of RX collection (big fiber &rarr; small PD = hard). This is exactly why Avicena chose a small ~6&micro;m emitter: small etendue couples efficiently; large devices would not. First-order geometry, not a ray-trace. <b>SPIE anchor (Song et al., FDTD):</b> <b>lateral offset</b> (their term: in-plane misalignment between the &micro;LED and its fiber core) shows a plateau then gradual roll-off, tolerance scaling with core size &mdash; the offset knob here reproduces that shape from disk overlap (normalized geometry, NOT their absolute %: their regime is lens-less butt coupling at &micro;m <b>gap distance</b> on 3-9&micro;m cores; our standoff sits after the TIR collimator, so only the shape transfers and their gap-distance curve is deliberately NOT imported). Adhesive filling (their Strategy 3) is omitted: at our polymer-1.5/silica-1.465 interfaces it is worth only ~0.33 dB per end, unlike their GaN-to-air case.';
const ETNOTE='<b>Etendue G = A·Ω (area × solid angle) is conserved</b> in any passive optic &mdash; it can only stay equal or grow, never shrink. Ω uses <b>sin²θ</b> because a beam spreads in two axes (3D): a cone of half-angle θ has Ω ≈ π·sin²θ steradian. So shrinking the output <b>angle</b> (Ω ÷N) forces the <b>aperture area</b> to grow ×N &mdash; that is why a small Lambertian µLED needs an exit aperture ~23× its emitter area at ±12°, and why <b>fill factor &lt; 100% is by design</b>, not a lens defect. <b>This is NOT energy conservation:</b> even with zero loss, etendue forbids squeezing a wide-angle source onto a tiny spot at a small angle &mdash; it behaves like entropy (2nd law), not power (1st law). A laser has very low etendue at the source (coherent) so it focuses tight and travels far; a Lambertian LED cannot be made to act like one by any passive optic.';
function ovE(a,b,cx,cy,R,rx,ry){var N=28,c=0;for(var i=0;i<N;i++){var x=cx-a+2*a*(i+0.5)/N;for(var j=0;j<N;j++){var y=cy-b+2*b*(j+0.5)/N,dx=(x-cx)/a,dy=(y-cy)/b;if(dx*dx+dy*dy<=1){var ex=x-rx,ey=y-ry;if(ex*ex+ey*ey<=R*R)c++;}}}return c*(4*a*b)/(N*N);}
function diskOverlap(R,r,dd){if(dd>=R+r)return 0;if(dd<=Math.abs(R-r))return Math.PI*Math.min(R,r)*Math.min(R,r);const a=(dd*dd+R*R-r*r)/(2*dd),b=dd-a;return R*R*Math.acos(Math.max(-1,Math.min(1,a/R)))-a*Math.sqrt(Math.max(R*R-a*a,0))+r*r*Math.acos(Math.max(-1,Math.min(1,b/r)))-b*Math.sqrt(Math.max(r*r-b*b,0));}
function heatRGB(t){t=Math.max(0,Math.min(1,t));const st=[[0,0,90],[0,0,255],[0,153,255],[0,255,255],[102,255,102],[255,255,0],[255,128,0],[204,0,0]];const seg=t*(st.length-1),i=Math.min(st.length-2,Math.floor(seg)),fr=seg-i,a=st[i],b=st[i+1];return [Math.round(a[0]+(b[0]-a[0])*fr),Math.round(a[1]+(b[1]-a[1])*fr),Math.round(a[2]+(b[2]-a[2])*fr)];}
function heatColor(t){t=Math.max(0,Math.min(1,t));const st=[[8,10,35],[25,55,170],[0,190,210],[40,215,70],[245,220,45],[240,45,30]];const seg=t*(st.length-1),i=Math.min(st.length-2,Math.floor(seg)),fr=seg-i,a=st[i],b=st[i+1];return 'rgb('+Math.round(a[0]+(b[0]-a[0])*fr)+','+Math.round(a[1]+(b[1]-a[1])*fr)+','+Math.round(a[2]+(b[2]-a[2])*fr)+')';}
const TAU=Math.PI*2;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function randn(rng){let u=0,v=0;while(u===0)u=rng();while(v===0)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);}
function erfc(x){const z=Math.abs(x),t=1/(1+0.5*z);const r=t*Math.exp(-z*z-1.26551223+t*(1.00002368+t*(.37409196+t*(.09678418+t*(-.18628806+t*(.27886807+t*(-1.13520398+t*(1.48851587+t*(-.82215223+t*.17087277)))))))));return x>=0?r:2-r;}
function berNRZ(Q){return Q<=0?0.5:0.5*erfc(Q/Math.SQRT2);}
function onepole(x,fc,dt){const a=Math.exp(-dt/(1000/(TAU*fc)));const y=new Float64Array(x.length);let p=x[0];for(let i=0;i<x.length;i++){p=a*p+(1-a)*x[i];y[i]=p;}return y;}
function onepoleZP(x,fc,dt){let y=onepole(x,fc,dt);const a=Math.exp(-dt/(1000/(TAU*fc)));let q=y[y.length-1];for(let i=y.length-1;i>=0;i--){q=a*q+(1-a)*y[i];y[i]=q;}return y;}
/* µLED slow roll-off (Avicena PTL 2025 / HotI 2025 Fig5-6): LED rolls off MUCH slower than a 6dB/oct
   single pole -> usable modulation far above the 3dB point. Model = dominant pole at f3 + weak fast
   feedthrough path at m*f3 that lifts the high-freq tail. b,m tuned so 10-11Gb/s opens on a ~2GHz LED. */
function ledFilt(x,f3,dt){const b=0.30,m=8;const s1=onepole(x,f3,dt),s2=onepole(x,f3*m,dt);const y=new Float64Array(x.length);for(let i=0;i<x.length;i++)y[i]=(1-b)*s1[i]+b*s2[i];return y;}
function gaussFilt(x,sig){if(sig<0.3)return x.slice();const R=Math.ceil(sig*4),k=[];let s=0;for(let i=-R;i<=R;i++){const w=Math.exp(-0.5*(i/sig)**2);k.push(w);s+=w;}for(let i=0;i<k.length;i++)k[i]/=s;const y=new Float64Array(x.length);for(let n=0;n<x.length;n++){let acc=0;for(let j=-R;j<=R;j++){const m=n+j;if(m>=0&&m<x.length)acc+=k[j+R]*x[m];}y[n]=acc;}return y;}
function mean(a){let s=0;for(let i=0;i<a.length;i++)s+=a[i];return s/a.length;}

/* eyeHeat: shared eye density heatmap (same pipeline as tab 1): vector lineTo with 'lighter' (additive count), gaussian blur, p99 normalize, gamma 1.5 -> JET, bilinear upscale */
function eyeHeat(ctx,x0,y0,w,h,tracesFn){
  const OW=Math.max(8,Math.round(w)),OH=Math.max(8,Math.round(h)),oc=document.createElement('canvas');oc.width=OW;oc.height=OH;const o=oc.getContext('2d');
  o.fillStyle='#000';o.fillRect(0,0,OW,OH);o.globalCompositeOperation='lighter';o.strokeStyle='rgb(3,3,3)';o.lineWidth=1;o.lineJoin='round';o.lineCap='round';

  const im=o.getImageData(0,0,OW,OH),px=im.data,N=OW*OH,dn=new Float32Array(N);for(let k=0;k<N;k++)dn[k]=px[k*4];
  const gk=[],gr=4;let gs=0;for(let q=-gr;q<=gr;q++){const wq=Math.exp(-q*q/(2*1.6*1.6));gk.push(wq);gs+=wq;}for(let q=0;q<gk.length;q++)gk[q]/=gs;

  for(let y=0;y<OH;y++)for(let x=0;x<OW;x++){let sm=0;for(let q=-gr;q<=gr;q++){const yy=Math.min(OH-1,Math.max(0,y+q));sm+=t1[yy*OW+x]*gk[q+gr];}bl[y*OW+x]=sm;}
  const lit=[];for(let k=0;k<N;k++)if(bl[k]>0.5)lit.push(bl[k]);lit.sort((a,b)=>a-b);const nrm=lit.length?lit[Math.floor(lit.length*0.99)]:1;
  for(let k=0;k<N;k++){const oi=k*4,t=Math.min(1,bl[k]/nrm);if(t<0.02){px[oi]=8;px[oi+1]=12;px[oi+2]=40;px[oi+3]=255;continue;}const cc=heatRGB(Math.pow(t,1.5));px[oi]=cc[0];px[oi+1]=cc[1];px[oi+2]=cc[2];px[oi+3]=255;}

function met(k,v){return `<div class="m"><div class="k">${k}</div><div class="v">${v}</div></div>`;}
function fmtber(b){return b<1e-12?'<1e-12':b.toExponential(1);}
function bestPhaseQ(sig,bits,sps,Nsym){let bQ=-1,bp=0;for(let ph=0;ph<sps;ph++){let m1=0,m0=0,n1=0,n0=0;for(let t=2;t<Nsym-2;t++){const v=sig[ph+t*sps];if(bits[t]){m1+=v;n1++;}else{m0+=v;n0++;}}if(n1<10||n0<10)continue;m1/=n1;m0/=n0;let s1=0,s0=0;for(let t=2;t<Nsym-2;t++){const v=sig[ph+t*sps];if(bits[t])s1+=(v-m1)**2;else s0+=(v-m0)**2;}const Q=(m1-m0)/(Math.sqrt(s1/n1)+Math.sqrt(s0/n0)+1e-12);if(Q>bQ){bQ=Q;bp=ph;}}return{Q:bQ,ph:bp};}

/* SSBI + CD  (NRZ vs PAM4, FFE-on, cancel vs no-cancel) */
function nrzSSBI(p){
  const {Rb,ledBW,rxBW,reach,Dcd,dlam,snr,mode,sps,Nsym,peak}=p;
  const mod='nrz';                                   // Avicena: NRZ only
  const ERlin=Math.pow(10,(p.ER!==undefined?p.ER:6.5)/10);
  const cspr=(p.cspr!==undefined)?p.cspr:10*Math.log10(Math.pow((ERlin+1)/Math.max(ERlin-1,1e-6),2)); // CSPR from ER
  const lv = (mod==='pam4')? [-3,-1,1,3].map(v=>v/Math.sqrt(5)) : [-1,1];
  const rng=mulberry(2024);const idx=new Int32Array(Nsym);for(let i=0;i<Nsym;i++)idx[i]=(rng()*lv.length)|0;
  const N=Nsym*sps;const dt=(1000/Rb)/sps;
  const C=Math.sqrt(Math.pow(10,cspr/10));const beta=1/(2*C);
  const s=new Float64Array(N);for(let i=0;i<Nsym;i++){const v=lv[idx[i]];for(let k=0;k<sps;k++)s[i*sps+k]=v;}
  const tau=Dcd*(reach/1000)*dlam;const sig=(tau/2.355)/dt;
  let sf=gaussFilt(s,sig);sf=ledFilt(sf,ledBW,dt);
  // incoherence washout: μLED emits directly-modulated INTENSITY from an incoherent carrier (τc~fs),
  // so the sf² self-beat (SSBI) averages out. gamma = 1/(1+Δν·T_UI) = 1/(1+UI/τc). Coherent laser: gamma=1.
  const dnu=3e8*Math.max(dlam,1e-4)*1e-9/Math.pow(430e-9,2), TUI=1/(Rb*1e9), gamma=(p.src==='coh')?1:1/(1+dnu*TUI);
  const inten=new Float64Array(N);for(let i=0;i<N;i++)inten[i]=2*C*sf[i]+gamma*sf[i]*sf[i];
  let r=onepoleZP(inten,rxBW,dt);const rm=mean(r);for(let i=0;i<N;i++)r[i]-=rm;
  if(peak>0){const g=Math.pow(10,peak/20)-1;const rl=onepole(r,Rb/2,dt);for(let i=0;i<N;i++)r[i]=r[i]+g*(r[i]-rl[i]);} // analog peaking
  const ac=std(r);const npw=ac*ac/Math.pow(10,snr/10);for(let i=0;i<N;i++)r[i]+=Math.sqrt(npw)*randn(rng);
  function cancel(){let lin=new Float64Array(N);for(let i=0;i<N;i++)lin[i]=r[i]/(2*C);
    if(mode!=='none'){for(let it=0;it<6;it++){const sq=new Float64Array(N);for(let i=0;i<N;i++)sq[i]=lin[i]*lin[i];
      const ss=(mode==='aware')?onepoleZP(sq,rxBW,dt):sq;const sm=mean(ss);
      for(let i=0;i<N;i++)lin[i]=0.5*lin[i]+0.5*((r[i]-gamma*beta*2*C*(ss[i]-sm))/(2*C));}}
    return lin;}
  function ffeSNR(x){const M=15,half=7;let bp=0,bv=-1;
    for(let ph=0;ph<sps;ph++){let m=0,c=0;for(let t=2;t<Nsym-2;t++){m+=x[ph+t*sps];c++;}m/=c;let v=0;for(let t=2;t<Nsym-2;t++)v+=(x[ph+t*sps]-m)**2;if(v>bv){bv=v;bp=ph;}}
    const samp=new Float64Array(Nsym);for(let t=0;t<Nsym;t++)samp[t]=x[bp+t*sps];const sm=mean(samp),ss2=std(samp);for(let t=0;t<Nsym;t++)samp[t]=(samp[t]-sm)/(ss2+1e-9);
    const w=new Float64Array(M);w[half]=1;const mu=0.008;
    for(let pass=0;pass<20;pass++)for(let t=M;t<Nsym-M;t++){let z=0;for(let k=0;k<M;k++)z+=w[k]*samp[t-half+k];const e=lv[idx[t]]-z;for(let k=0;k<M;k++)w[k]+=mu*e*samp[t-half+k];}
    let sig2=0,err2=0;for(let t=M;t<Nsym-M;t++){let z=0;for(let k=0;k<M;k++)z+=w[k]*samp[t-half+k];let q=lv[0],bd=1e9;for(const L of lv){const dd=Math.abs(z-L);if(dd<bd){bd=dd;q=L;}}sig2+=q*q;err2+=(z-q)**2;}
    return {snr:10*Math.log10(sig2/Math.max(err2,1e-30)),ph:bp};}
  const linNo=new Float64Array(N);for(let i=0;i<N;i++)linNo[i]=r[i]/(2*C);
  const linC=cancel();
  const rNo=ffeSNR(linNo),rC=ffeSNR(linC);
  return {lin:linC,idx,lv,sps,ph:rC.ph,tau,beta,cspr,gamma,snrNo:rNo.snr,snrCancel:rC.snr};
}

/* 2-PD electrical crosstalk */
function xtalkSim(p){
  const {xt,K,cmFrac,cmrr,snr,sps,Nsym}=p;
  const rng=mulberry(55);const N=Nsym*sps;
  const vb=new Uint8Array(Nsym);for(let i=0;i<Nsym;i++)vb[i]=rng()<0.5?0:1;
  const vic=new Float64Array(N);for(let i=0;i<Nsym;i++){const v=vb[i]?1:0;for(let k=0;k<sps;k++)vic[i*sps+k]=v;}
  const _dt=(1000/4)/sps;let vicF=onepole(vic,8,_dt);
  const a=Math.pow(10,xt/20);const xtot=new Float64Array(N);
  for(let kk=0;kk<K;kk++){const arng=mulberry(1000+kk*7);const ab=new Uint8Array(Nsym);for(let i=0;i<Nsym;i++)ab[i]=arng()<0.5?0:1;
    for(let i=0;i<Nsym;i++){const v=(ab[i]?1:0)-0.5;for(let k=0;k<sps;k++)xtot[i*sps+k]+=a*v;}}
  const cmA=Math.sqrt(cmFrac),dfA=Math.sqrt(1-cmFrac),cmres=Math.pow(10,-cmrr/20);
  const sd=std(vicF);const npw=sd*sd/Math.pow(10,snr/10);const ns=Math.sqrt(npw);
  const se=new Float64Array(N),pd=new Float64Array(N);
  for(let i=0;i<N;i++){const xc=cmA*xtot[i],xd=dfA*xtot[i];const n1=ns*randn(rng),n2=ns*randn(rng);
    se[i]=vicF[i]+xc+xd+n1;
    pd[i]=vicF[i]+xd+xc*cmres+(n1-n2)/Math.SQRT2;}
  const bSE=bestPhaseQ(se,vb,sps,Nsym),bPD=bestPhaseQ(pd,vb,sps,Nsym);
  return {se,pd,vb,sps,phSE:bSE.ph,phPD:bPD.ph,berSE:berNRZ(bSE.Q),berPD:berNRZ(bPD.Q),Qse:bSE.Q,Qpd:bPD.Q};
}


/* RX sensitivity: BER vs received optical power. Calibrated to eKit slide-3 PIN: 1e-13@-14dBm.
   Q ~ kQ * P^0.35 (sub-linear: LED signal-dependent noise), calibrated to PTL2025 Fig6. */
function sensBER(PdBm,ERdB,Rb){
  const P=Math.pow(10,PdBm/10); // mW (average received optical power)
  const kQ=18.7,nP=0.31;        // Q~kQ*P^nP: fit to PTL2025 Fig6 waterfall SLOPE (nP=0.31 = signal-dependent LED noise). thermal-limited would be nP=1 (steeper)
  const Ppow=Math.pow(P,nP);
  const er=Math.pow(10,(ERdB===undefined?6.5:ERdB)/10);
  const oma=(er-1)/(er+1);
  const oma0=(Math.pow(10,6.5/10)-1)/(Math.pow(10,6.5/10)+1);
  const g=oma/oma0;                              // relative OMA vs calibration ER=6.5dB
  const Q=kQ*Ppow*g;             // waterfall shape only (nP fit to Fig6). Baud sensitivity applied as a power shift by caller.
  return {Q,ber:berNRZ(Q)};
}
/* TX ABC model (SPIE 2026, NCSU+Avicena). 1/tau_DCL = A + 2*B*N + 3*C*N^2 (differential lifetime).
   N solved from J via generation=recombination: A*N + B*N^2 + C*N^3 = J/(q*d).
   Measured coeffs: A=3e8 s^-1, B=4e-11 cm3/s, C=5e-29 cm6/s (A,C ~100x lighting LED -> speed over efficiency).
   tau_nr (via A + Auger 3CN^2) dominates and drops with J and T -> BW rises. SQW faster than 2QW (unequal well filling). */
function ledBWfromJ(J,Tc,qw){
  /* base = Rogers et al. PTL 36,1069 (2024), NCSU deck slide 13 "Bandwidth versus Current and
     Temperature", 25C trace, read from the plot:
        J (A/cm2):   10    100   1000   3000   6000   10000
        E-O 3dB:    0.55  0.70   0.85   1.5    2.6    3.5    GHz
     These are E-O (optical S21): the same deck's impedance fit gives tau = 534 ps at 104 A/cm2,
     whose E-O 3dB is 521 MHz and matches the 0.55-0.70 GHz floor; the E-E value (301 MHz) does
     not. bwOfJ() therefore returns the E-E corner = E-O / sqrt(3), which is what a filter applied
     to the optical waveform needs.
     v337/v340 carried a different table (1.7 -> 4.8 GHz) citing the wrong slide; it sat 1.5-2.1x
     above the deck and rose steadily where the deck is flat then steep. */
  const base=bwOfJ(J);
  const qwf=(qw===2?0.55:1.0);
  const w=Math.max(0,1-(Math.log10(J)-1)/3);
  const tBoost=1+0.5*w*(Math.max(Tc||25,25)-25)/375;
  return Math.max(0.15,Math.min(tBoost*qwf*base,6));
}
function bwOfJ(J){/* E-E corner = slide-13 E-O / sqrt(3) */const Jt=[10,100,1000,3000,6000,10000],Bt=[0.318,0.404,0.491,0.866,1.501,2.021];J=Math.max(Math.min(J,10000),10);const lj=Math.log10(J);for(let i=0;i<Jt.length-1;i++){if(lj<=Math.log10(Jt[i+1])){const t=(lj-Math.log10(Jt[i]))/(Math.log10(Jt[i+1])-Math.log10(Jt[i]));return Bt[i]+t*(Bt[i+1]-Bt[i]);}}return Bt[5];}
function jOfBw(bw){const Jt=[100,500,1000,2000,5000,10000],Bt=[1.7,2.2,2.8,3.3,4.2,4.8];bw=Math.max(Math.min(bw,4.8),1.42);for(let i=0;i<Bt.length-1;i++){if(bw<=Bt[i+1]){const t=(bw-Bt[i])/(Bt[i+1]-Bt[i]);return Math.pow(10,Math.log10(Jt[i])+t*(Math.log10(Jt[i+1])-Math.log10(Jt[i])));}}return Jt[5];}

function _modalDensity(NA,alpha,fill,reachM,NB){
  NB=NB||90;
  if(!(NA>0)||!(reachM>0))return null;
  const NCL=1.457,C0=299792458;
  const nco=Math.sqrt(NCL*NCL+NA*NA),DEL=(nco*nco-NCL*NCL)/(2*nco*nco);
  const nOf=u=>nco*Math.sqrt(Math.max(1-2*DEL*Math.pow(Math.min(u,1),alpha),1e-9));
  const delayOf=th=>{const beta=nco*Math.cos(th);
    const sq=(1-Math.pow(beta/nco,2))/(2*DEL);
    if(sq<=0)return nco/C0;
    const rt=Math.pow(sq,1/alpha); if(rt>1)return null;
    let Lz=0,Tt=0;const N=260,dr=rt/N;
    for(let i=0;i<N;i++){const r=(i+0.5)/N*rt,n=nOf(r),num=n*n-beta*beta;
      if(num<=0)continue;const sr=Math.sqrt(num);
      Lz+=beta/sr*dr;Tt+=n*n/(C0*sr)*dr;}
    return Lz>0?Tt/Lz:nco/C0;};
  const thMax=Math.asin(Math.min(NA/nco,0.999)),NR=600,rays=[];
  for(let i=0;i<NR;i++){const th=(i+0.5)/NR*thMax,t=delayOf(th);
    if(t===null)continue;
    const _sg=(fill*Math.PI/180)/1.17741;const w=Math.sin(th)*Math.cos(th)*((fill>=90)?1:Math.exp(-(th*th)/(2*_sg*_sg)));
    rays.push({t,w});}
  if(!rays.length)return null;
  let t0=1e9,t1=-1e9;for(const r of rays){t0=Math.min(t0,r.t);t1=Math.max(t1,r.t);}
  const bins=new Float64Array(NB);let sum=0;
  for(const r of rays){const u=(r.t-t0)/((t1-t0)||1e-30);
    const x=Math.min(NB-1,Math.max(0,u*NB-0.5)),k0=Math.floor(x),fr=x-k0;
    if(k0>=0&&k0<NB)bins[k0]+=r.w*(1-fr);
    if(k0+1<NB)bins[k0+1]+=r.w*fr;
    sum+=r.w;}
  for(let i=0;i<NB;i++)bins[i]/=sum;
  const spreadPs=(t1-t0)*reachM*1e12;
  let mean=0;for(let i=0;i<NB;i++)mean+=bins[i]*(i+0.5)/NB*spreadPs;
  let v=0;for(let i=0;i<NB;i++){const tt=(i+0.5)/NB*spreadPs;v+=bins[i]*(tt-mean)*(tt-mean);}
  return {bins:bins,NB:NB,spreadPs:spreadPs,meanPs:mean,rmsPs:Math.sqrt(v)};
}
function _modalH(dens,fGHz){
  if(!dens)return 1;
  let re=0,im=0;
  for(let i=0;i<dens.NB;i++){const t=((i+0.5)/dens.NB*dens.spreadPs-dens.meanPs)*1e-12;
    const ph=-2*Math.PI*fGHz*1e9*t;re+=dens.bins[i]*Math.cos(ph);im+=dens.bins[i]*Math.sin(ph);}
  return Math.hypot(re,im);
}


/* End-to-end optical budget: LED power -> launch -> fibre -> collection -> Prx.
   Reuses the same geometry the Collection tab draws, so the two agree by construction. */
function _optBudget(){
  const em=P.emD, NA=P.fiberNA, core=_coreD();
  const omaUW=Math.max(P.pLed,1e-3);
  /* TX: emitter through the TIR lens into the core (same model as the Collection tab, TX side) */
  const thTX=12*Math.PI/180, lensTX=em/Math.sin(thTX), zTX=30, capture=0.85;
  const beamF=lensTX+2*zTX*Math.tan(thTX);
  const spatial=Math.min(1,diskOverlap(core/2,beamF/2,Math.abs(P.txOff||0))/(Math.PI*(beamF/2)*(beamF/2)));
  const angular=Math.min(1,(NA/Math.sin(thTX))*(NA/Math.sin(thTX)));
  const launch=Math.max(1e-4,Math.min(1,spatial*capture*angular));
  const launchdB=-10*Math.log10(launch);
  /* fibre attenuation over the reach */
  const fibdB=Math.max(0,P.fibAtt)*Math.max(0,P.reach);
  /* RX: lens capture x core-to-lens cover x PD fill (same terms as the Collection tab, RX side) */
  const Del=Math.max(P.lensD,P.pdD), z=P.zStand, refl=P.dtiRefl/100;
  const s12=Math.sin(12*Math.PI/180);
  const th=Math.asin(Math.min(0.99,Math.min(1,50/Del)*s12));
  const Dbeam=Del+2*z*Math.tan(th), bA=Math.PI*(Dbeam/2)*(Dbeam/2);
  const ov=(R,r)=>{const d=0;if(r>=R)return Math.PI*R*R;return Math.PI*r*r;};
  /* 2-PD dual-collect: two detectors side by side inside one lens pitch, so each one is
     capped at half the pitch minus the gap. Areas add; the smaller discs cost some fill. */
  const dEff=_rxIsDual()?Math.min(P.pdD,Math.max((P.lensD-P.pdGap2)/2,2)):P.pdD;
  const nPD=_rxIsDual()?2:1;
  const f0=Math.min(1,nPD*ov(Dbeam/2,dEff/2)/bA);
  const fw=Math.min(1,ov(Dbeam/2,Math.min(Del,Dbeam)/2)/bA);
  const pdOut={dEff,nPD};
  const fill=Math.min(1,0.90*Math.min(1,(Del/core)*(Del/core))
                       *(f0+Math.max(0,fw-f0)*refl*Math.min(1,P.dtiH/Math.max(z,1))));
  const collDB=-10*Math.log10(Math.max(fill,1e-4));
  const pLedDBm=10*Math.log10(omaUW/1000);
  return {pLedDBm, omaUW, launchdB, fibdB, collDB, dEff:pdOut.dEff, nPD:pdOut.nPD,
          spatialdB:-10*Math.log10(spatial), angulardB:-10*Math.log10(angular), capdB:-10*Math.log10(capture),
          prx: pLedDBm-launchdB-fibdB-collDB,
          launchPct:100*launch, fillPct:100*fill};
}
/* Two independent crosstalk mechanisms, each from its own physics.
   OPTICAL: light from a neighbour lens spilling onto this PD - pure geometry, same
            model the Collection tab draws (beam overlap, DTI shielding, n neighbours).
   ELECTRICAL: coupling between adjacent RX input nodes - scales with node pitch and baud.
   The input-node pitch is the PD pitch, so it is not a free parameter here.
   Single-ended PD, so the receiver takes both in full. */
function _xtResidual(){
  const baud=Math.max(P.Rb,0.1);
  const Del=Math.max(P.lensD,P.pdD), z=Math.max(P.zStand,1), refl=P.dtiRefl/100;
  const s12=Math.sin(12*Math.PI/180);
  const th=Math.asin(Math.min(0.99,Math.min(1,50/Del)*s12));
  const Dbeam=Del+2*z*Math.tan(th), Rb_=Dbeam/2, bA=Math.PI*Rb_*Rb_;
  const gbase=diskOverlap(Rb_,P.pdD/2,Math.abs(Del))/bA;
  const xtO=Math.min(1,gbase*(1-refl*Math.min(1,P.dtiH/z))*Math.max(P.nbr,1));
  const xtOdB=10*Math.log10(Math.max(xtO,1e-9));
  /* electrical crosstalk couples between adjacent PD -> TIA input nodes,
     so the PD size/pitch sets it - the lens plays no part here. */
  /* the input-node pitch is set by whichever is larger - a PD cannot sit closer to its
     neighbour than the lens pitch allows, and a PD wider than the lens sets its own pitch */
  const pitch=Math.max(P.pdD,P.lensD,4), nAgg=Math.max(P.nbr,1);
  const xtEraw=-22+20*Math.log10(20/pitch)+20*Math.log10(baud/4)+10*Math.log10(nAgg);
  /* a differential front end sees the part that couples into BOTH nodes as common mode
     and rejects it to the CMRR limit; the rest survives */
  const cm=_rxIsDual()?Math.max(0,Math.min(1,P.cmFrac)):0, rej=Math.pow(10,-P.cmrr/10);
  const xtEdB=xtEraw+10*Math.log10((1-cm)+cm*rej);
  const eff=Math.pow(10,xtOdB/10)+Math.pow(10,xtEdB/10);
  return {xtOdB, xtEdB, xtEraw, effDB:10*Math.log10(Math.max(eff,1e-12)), amp:Math.sqrt(eff)};
}

/* Slide 16 shows the LED S21 -3 dB point moving with current density: about 1.7 GHz at
   100 A/cm2 rising to 4.8 GHz at 10 kA/cm2, so the link tabs never treat LED bandwidth as a
   free number: it is always read off that curve, using the drive current implied by the
   optical power (PTL Fig 4: about 53 uW per mA) and the emitter area. */
function _ledJ(){
  const mA=Math.max(P.pLed,1)/53;                    /* PTL Fig 4: about 53 uW per mA */
  return Math.max(10,Math.min(1e4,mA*1e-3/(Math.max(P.ledArea,1)*1e-8)));
}
function _ledBWeff(){ return bwOfJ(_ledJ()); }

/* One detector choice drives everything downstream. The APD constants are the calibrated
   eKit values and deliberately not sliders: M = 2.5 with excess noise F = M^0.3, which is a
   silicon avalanche at 430 nm where absorption is shallow and the multiplication is electron
   initiated, so k and therefore x are low. Responsivity stays the PIN value and the gain is
   applied on top of it, so R_eff = R x M. */
var APD_M=2.5, APD_X=0.3;

/* Lens and fibre core are built as a pair, so the model keeps them equal. Letting them drift apart
   costs (lens/core)^2 in collection - a 25 um lens facing a 50 um core throws away about 6 dB before
   anything else happens - and nobody would build that. The lens slider is the control; the core
   follows it, which is why there is no separate core slider on the link tabs. */
function _coreD(){ return Math.max(1,P.lensD||50); }
function _rxIsDual(){ return (P.rxDet|0)===1; }
function _rxGain(){ return ((P.rxDet|0)===2)?APD_M:1; }
function _isiBudget(){
  const Rb=Math.max(P.Rb||4,0.1), UI=1000/Rb;
  /* LED, main path (ledResp): rise essentially instantaneous; fall = (1-tf) instantaneous plus a
     fraction tf decaying with fixed time constant ledTailPs. rms of (1-tf)*delta + tf*exp(-t/tau)/tau
     is tau*sqrt(tf*(2-tf)); half of NRZ transitions are falls -> multiply by sqrt(1/2).
     Through v340 this row was computed from a single pole (then a two-pole blend) at ledBW, which is
     NOT what the chain applies; it under-reported the LED term by 4-10x. */
  const tf=Math.max(0,Math.min(0.9,P.ledTail||0)), tauT=Math.max(5,P.ledTailPs||250);
  const sLED=tauT*Math.sqrt(tf*(2-tf))*Math.SQRT1_2;
  const sCD=(P.Dcd*(Math.max(P.reach,0)/1000)*P.dlam)/2.355;
  const dn=_modalDensity(P.linkNA,(P.fbAlpha===undefined?99:P.fbAlpha),
                         (P.th50===undefined?5.5:P.th50),Math.max(P.reach,0),90);
  const sMOD=dn?dn.rmsPs:0;
  const sRX=(P.rxBW>0)?0.18*(Rb/P.rxBW)*UI:0;
  const vL=sLED*sLED, vC=sCD*sCD, vM=sMOD*sMOD, vR=sRX*sRX, vT=vL+vC+vM+vR;
  const pct=v=>vT>0?(100*v/vT):0;
  return {UI:UI,
    led:{rms:sLED,ui:sLED/UI,pct:pct(vL)},
    cd:{rms:sCD,ui:sCD/UI,pct:pct(vC)},
    mod:{rms:sMOD,ui:sMOD/UI,pct:pct(vM)},
    rx:{rms:sRX,ui:sRX/UI,pct:pct(vR)},
    tot:{rms:Math.sqrt(vT),ui:Math.sqrt(vT)/UI}};
}

function _modalKernel(NA,alpha,fill,reachM,Rb,sps){
  if(!(NA>0)||!(reachM>0))return null;
  const key=NA.toFixed(3)+'|'+alpha.toFixed(2)+'|'+fill.toFixed(2)+'|'+reachM.toFixed(2)+'|'+Rb.toFixed(2)+'|'+sps;
  if(_mkCache[key]!==undefined)return _mkCache[key];
  const NCL=1.457,C0=299792458;
  const nco=Math.sqrt(NCL*NCL+NA*NA),DEL=(nco*nco-NCL*NCL)/(2*nco*nco);
  const nOf=u=>nco*Math.sqrt(Math.max(1-2*DEL*Math.pow(Math.min(u,1),alpha),1e-9));
  const delayOf=th=>{const beta=nco*Math.cos(th);
    const sq=(1-Math.pow(beta/nco,2))/(2*DEL);
    if(sq<=0)return nco/C0;
    const rt=Math.pow(sq,1/alpha); if(rt>1)return null;
    let Lz=0,Tt=0;const N=260,dr=rt/N;
    for(let i=0;i<N;i++){const r=(i+0.5)/N*rt,n=nOf(r),num=n*n-beta*beta;
      if(num<=0)continue;const sr=Math.sqrt(num);
      Lz+=beta/sr*dr;Tt+=n*n/(C0*sr)*dr;}
    return Lz>0?Tt/Lz:nco/C0;};
  const thMax=Math.asin(Math.min(NA/nco,0.999)),NR=140,rays=[];
  for(let i=0;i<NR;i++){const th=(i+0.5)/NR*thMax,t=delayOf(th);
    if(t===null)continue;
    const _sg=(fill*Math.PI/180)/1.17741;const w=Math.sin(th)*Math.cos(th)*((fill>=90)?1:Math.exp(-(th*th)/(2*_sg*_sg)));
    rays.push({t,w});}
  if(!rays.length){_mkCache[key]=null;return null;}
  let t0=1e9,t1=-1e9,W=0;
  for(const r of rays){t0=Math.min(t0,r.t);t1=Math.max(t1,r.t);W+=r.w;}
  const spreadPs=(t1-t0)*reachM*1e12;
  const Nw=Math.round(spreadPs*Rb*sps/1000);
  if(Nw<2){_mkCache[key]=null;return null;}
  const K=Math.min(Nw+2,60*sps),k=new Float64Array(2*K+1);
  const tmp=new Float64Array(Nw);let sum=0,cen=0;
  for(const r of rays){const u=(r.t-t0)/((t1-t0)||1e-30);
    const idx=Math.min(Nw-1,Math.max(0,Math.floor(u*Nw)));tmp[idx]+=r.w;}
  for(let i=0;i<Nw;i++){sum+=tmp[i];cen+=tmp[i]*i;}

  _mkCache[key]=k;return k;

  const nco=Math.sqrt(NCL*NCL+NA*NA),DEL=(nco*nco-NCL*NCL)/(2*nco*nco);
  const nOf=u=>nco*Math.sqrt(Math.max(1-2*DEL*Math.pow(Math.min(u,1),alpha),1e-9));
  const delayOf=th=>{const beta=nco*Math.cos(th);
    const sq=(1-Math.pow(beta/nco,2))/(2*DEL);
    if(sq<=0)return nco/C0;
    const rt=Math.pow(sq,1/alpha); if(rt>1)return null;
    let Lz=0,Tt=0;const N=260,dr=rt/N;
    for(let i=0;i<N;i++){const r=(i+0.5)/N*rt,n=nOf(r),num=n*n-beta*beta;

       /* k<0 correlates with an EARLIER symbol -> post-cursor */

      globalThis._cdCurve={dN:dN,dP:dP,dD:dD};

      const bpw=el._br._w-bp.l-bp.r,bph=el._br._h-bp.t-bp.b,yF=bp.t+(1-(-7+12)/12)*bph;
      bc.strokeStyle='#c678dd';bc.setLineDash([5,4]);bc.beginPath();bc.moveTo(bp.l,yF);bc.lineTo(bp.l+bpw,yF);bc.stroke();bc.setLineDash([]);bc.strokeStyle='#c678dd';bc.setLineDash([4,3]);bc.beginPath();bc.moveTo(bp.l+bpw+6,yF);bc.lineTo(bp.l+bpw+15,yF);bc.stroke();bc.setLineDash([]);bc.fillStyle='#c678dd';bc.font='9px system-ui';bc.fillText('ECC 1e-7',bp.l+bpw+18,yF+3);
      if(!el._br._tipInit){el._br._tipInit=1;el._br.addEventListener('mousemove',ev=>{const rc=el._br.getBoundingClientRect();el._br._mx=(ev.clientX-rc.left)/rc.width*el._br._w;schedule();});el._br.addEventListener('mouseleave',()=>{el._br._mx=null;schedule();});}
      if(el._br._mx!=null&&el._br._mx>=bp.l&&el._br._mx<=bp.l+bpw){const mx=el._br._mx,reach=(mx-bp.l)/bpw*80;const itp=d=>{for(let k=1;k<d.length;k++){if(d[k][0]>=reach){const t=(reach-d[k-1][0])/((d[k][0]-d[k-1][0])||1);return Math.pow(10,Math.log10(d[k-1][1])*(1-t)+Math.log10(d[k][1])*t);}}return d[d.length-1][1];};const bN=itp(dN),bP=itp(dP);bc.strokeStyle='#8b98ac';bc.setLineDash([2,2]);bc.beginPath();bc.moveTo(mx,bp.t);bc.lineTo(mx,bp.t+bph);bc.stroke();bc.setLineDash([]);const tx=mx>bp.l+bpw-98?mx-94:mx+6;bc.fillStyle='#0d1117';bc.fillRect(tx,bp.t+3,90,40);bc.strokeStyle='#30363d';bc.strokeRect(tx,bp.t+3,90,40);bc.fillStyle='#e5c07b';bc.font='10px system-ui';bc.fillText('reach '+reach.toFixed(1)+'m',tx+5,bp.t+15);bc.fillStyle='#8b98ac';bc.fillText('no-pk '+fmtber(bN),tx+5,bp.t+27);bc.fillStyle='#58a6ff';bc.fillText('peak '+fmtber(bP),tx+5,bp.t+39);}

var CAPTURE_RX=0.90;
function optRX(reflP,nbr,thresh,pitch){var z=P.zStand,lg=P.lensGap,Dref=50,s12=Math.sin(12*Math.PI/180),refl=reflP/100,best=null;var fCore=pitch||_coreD();for(var pd=8;pd<=50;pd+=2){for(var gap=2;gap<=12;gap+=2){var minL=Math.max(25,2*pd+gap);if(pitch){if(2*pd+gap>pitch)continue;}else if(minL>50)continue;var _lo=pitch||minL,_hi=pitch||50;for(var Del=_lo;Del<=_hi;Del+=1){var th=Math.asin(Math.min(0.99,Math.min(1,Dref/Del)*s12)),tanT=Math.tan(th),Dbeam=Del+2*z*tanT,bA=Math.PI*(Dbeam/2)*(Dbeam/2),p2=pd+gap;var f0=Math.min(1,(diskOverlap(Dbeam/2,pd/2,p2/2)+diskOverlap(Dbeam/2,pd/2,p2/2))/bA);var Dw=Math.min(Del,Dbeam),fw=Math.min(1,diskOverlap(Dbeam/2,Dw/2,0)/bA);for(var h=0;h<=Math.min(15,z);h+=1){var fill=Math.min(1,CAPTURE_RX*Math.min(1,(Del/fCore)*(Del/fCore))*(f0+Math.max(0,fw-f0)*refl*Math.min(1,h/z)));var g=(diskOverlap(Dbeam/2,pd/2,Math.abs(Del+lg+p2/2))+diskOverlap(Dbeam/2,pd/2,Math.abs(Del+lg-p2/2)))/bA;var xt=Math.min(1,g*(1-refl*Math.min(1,h/z))*nbr),xtdB=10*Math.log10(Math.max(xt,1e-6));if(xtdB<thresh&&(!best||fill>best.fill))best={fill:fill,xtdB:xtdB,Del:Del,pd:pd,gap:gap,h:h};}}}}return best;}

function optEllipse(reflP,nbr,thresh,pitch){var z=P.zStand,lg=P.lensGap,Dref=50,s12=Math.sin(12*Math.PI/180),refl=reflP/100,best=null;var fCore=pitch||_coreD();for(var pd=8;pd<=24;pd+=2){for(var gap=2;gap<=6;gap+=2){var minL=Math.max(25,2*pd+gap);if(pitch){if(2*pd+gap>pitch)continue;}else if(minL>50)continue;var _lo=pitch||minL,_hi=pitch||50;for(var Del=_lo;Del<=_hi;Del+=2){var th=Math.asin(Math.min(0.99,Math.min(1,Dref/Del)*s12)),tanT=Math.tan(th),Dbeam=Del+2*z*tanT,bA=Math.PI*(Dbeam/2)*(Dbeam/2),Rb=Dbeam/2,p2=pd+gap,aE=pd/2;for(var asp=1;asp<=4.001;asp+=0.5){var bE=aE*asp;if(bE>Rb)break;var f0=Math.min(1,(ovE(aE,bE,-p2/2,0,Rb,0,0)+ovE(aE,bE,p2/2,0,Rb,0,0))/bA);var g=(ovE(aE,bE,-p2/2,0,Rb,Del+lg,0)+ovE(aE,bE,p2/2,0,Rb,Del+lg,0))/bA;var Dw=Math.min(Del,Dbeam),fw=Math.min(1,diskOverlap(Dbeam/2,Dw/2,0)/bA);for(var h=0;h<=Math.min(15,z);h+=1){var fill=Math.min(1,CAPTURE_RX*Math.min(1,(Del/fCore)*(Del/fCore))*(f0+Math.max(0,fw-f0)*refl*Math.min(1,h/z)));var xt=Math.min(1,g*(1-refl*Math.min(1,h/z))*nbr),xtdB=10*Math.log10(Math.max(xt,1e-6));if(xtdB<thresh&&(!best||fill>best.fill))best={fill:fill,xtdB:xtdB,Del:Del,pd:pd,gap:gap,h:h,asp:asp};}}}}}return best;}
function rxOptimize(pitch){var tsel=document.getElementById('sel_thr'),thresh=tsel?parseFloat(tsel.value):-40;var csel=document.getElementById('sel_cfg'),cfg=csel?csel.value:'2pd';var isL=(cfg==='ellip'),is2=(cfg==='2pd');var _sz=P.zStand,b=null,bZ=_sz;for(var _z=10;_z<=40;_z+=2){P.zStand=_z;var _b=isL?optEllipse(P.dtiRefl,P.nbr,thresh,pitch):is2?optRX(P.dtiRefl,P.nbr,thresh,pitch):optRX(P.dtiRefl,P.nbr,thresh,pitch);if(_b&&(!b||_b.fill>b.fill)){b=_b;bZ=_z;}}P.zStand=bZ;var r=document.getElementById('rxoptres');if(!b){P.zStand=_sz;if(r)r.textContent='no config meets '+thresh+' dB';return;}if(pitch){_coreD()=pitch;P.lensGap=0;}P.lensD=b.Del;P.pdD=b.pd;P.dtiH=b.h;if(is2||isL)P.pdGap=b.gap;if(isL)P.aspect=b.asp;build();var sc=document.getElementById('sel_cfg');if(sc)sc.value=cfg;schedule();var rr=document.getElementById('rxoptres');if(rr)rr.textContent=(pitch?'@'+pitch+'\u00b5m pitch  ':'')+'\u2192 lens '+b.Del+' / PD '+b.pd+((is2||isL)?' / gap '+b.gap:'')+(isL?' / asp '+b.asp:'')+' / DTI '+b.h+'\u00b5m / z '+bZ+'\u00b5m'+(P.lensGap>0?' | lens-gap '+P.lensGap+'\u00b5m':'')+'  \u21d2 fill '+(100*b.fill).toFixed(0)+'%, xt '+b.xtdB.toFixed(0)+'dB';}
