<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MicroLED Sim Lab — offline</title>
<style>
:root{--bg:#0b1020;--pan:#111a2e;--ink:#e5e7eb;--mut:#8b98ac;--acc:#58a6ff;--grn:#3fb950;--red:#ef4444;--amb:#f0a35e;--grid:#1b2540;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
header{padding:12px 16px;border-bottom:1px solid var(--grid);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0;color:var(--acc)}
.tabs{display:flex;flex-direction:column;gap:6px;width:100%;margin-top:8px}
.trow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.trow.sub .tab{font-size:11.5px;padding:4px 10px;opacity:0.85}
.btn{width:100%;padding:7px;margin:6px 0;background:var(--acc);color:#08101f;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px}
.btn.grn{background:var(--grn)}
.btn.half{width:49%}.btn.half+.btn.half{margin-left:2%}
.tab{padding:6px 12px;border:1px solid var(--grid);border-radius:8px;background:var(--pan);color:var(--mut);cursor:pointer;font-size:13px}
.tab.on{color:var(--ink);border-color:var(--acc);background:#16243f}
main{max-width:1120px;margin:0 auto;padding:14px}
.wrap{display:grid;grid-template-columns:440px 1fr;gap:12px;align-items:start}
  .wrap>.panel:first-child{position:sticky;top:8px;max-height:calc(100vh - 20px);overflow-y:auto}
  #ctrls .ctlgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  #ctrls .sechd{grid-column:1 / -1}
  @media (max-width:1000px){.wrap{grid-template-columns:1fr}
    .wrap>.panel:first-child{position:static;max-height:none}
    #ctrls .ctlgrid{grid-template-columns:1fr}}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--pan);border:1px solid var(--grid);border-radius:12px;padding:10px}
.ctl{margin-bottom:7px}.ctl label{font-size:12px}
.ctl label{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:12px;line-height:1.25;color:var(--mut);margin-bottom:4px}
.ctl label b{color:var(--ink);font-variant-numeric:tabular-nums;flex:0 0 auto;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--acc)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.m{background:#0d1730;border:1px solid var(--grid);border-radius:8px;padding:8px}
.m .k{font-size:11px;color:var(--mut)}.m .v{font-size:16px;font-variant-numeric:tabular-nums}
canvas{width:100%;background:#0a1226;border:1px solid var(--grid);border-radius:10px;display:block;margin-bottom:8px}
.note{font-size:12px;color:var(--mut);line-height:1.5}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid var(--grid)}
h3{margin:2px 0 10px;font-size:14px}
select{background:#0d1730;color:var(--ink);border:1px solid var(--grid);border-radius:6px;padding:4px;width:100%}
.subtabs{display:flex;gap:6px;margin:0 0 10px 0}.sub{flex:1;padding:6px 4px;font:600 11px system-ui;color:#8b98ac;background:#141b26;border:1px solid #25324e;border-radius:6px;cursor:pointer}.sub.on{color:#0d1117;background:#58a6ff;border-color:#58a6ff}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.fgrid canvas{margin-bottom:0}
.isit{width:100%;border-collapse:collapse;font:11px system-ui;margin:0 0 12px 0}.isit th{text-align:left;color:#8b98ac;font-weight:600;padding:5px 8px;border-bottom:1px solid #25324e}.isit td{padding:5px 8px;border-bottom:1px solid #1a2439;color:#cbd5e1}.isit td.dim{color:#66748c}.isit tr.tot td{color:#e5c07b;font-weight:600}.isit tr.eqr td{color:#3fb950;font-weight:600;border-top:1px solid #25324e}
.sechd{margin:10px 0 6px 0;padding:2px 0 4px 0;font:600 10px system-ui;letter-spacing:.5px;text-transform:uppercase;color:#8b98ac;border-bottom:1px solid #25324e}
  .sechd.tx{color:#e5c07b;border-bottom-color:#5a4a28}
  .sechd.opt{color:#3fb950;border-bottom-color:#255a2e}
  .sechd.rx{color:#ff6b6b;border-bottom-color:#6b2f2f}.sechd:first-child{margin-top:0}
</style></head>
<body>
<header>
  <h1>LED over Multimode Fiber</h1><span class="pill">modal dispersion explorer &middot; single file &middot; offline</span>
  <div class="tabs"><div class="trow">
    <div class="tab on" data-t="fiber">Fiber modes</div>
  </div></div>
</header>
<main><div class="wrap">
  <div class="panel" id="ctrls"></div>
  <div><div id="view"></div></div>
</div></main>
<script>
const P={reach:20, Rb:2, fibNA:0.2, fbAlpha:99, fbCoreR:25, fbClad:12, fbLam:450, th50:5.5};
function mkCanvas(id,h,wOpt){const c=document.createElement('canvas');c.id=id;const dpr=window.devicePixelRatio||1;const w=wOpt||760;c.width=w*dpr;c.height=h*dpr;c.style.height=h+'px';c.getContext('2d').scale(dpr,dpr);c._w=w;c._h=h;return c;}
function clear(ctx,c){ctx.clearRect(0,0,c._w,c._h);}
function met(k,v){return `<div class="m"><div class="k">${k}</div><div class="v">${v}</div></div>`;}
function slider(key,label,min,max,step){return `<div class="ctl"><label>${label}<b id="v_${key}">${P[key]}</b></label><input type="range" id="s_${key}" min="${min}" max="${max}" step="${step}" value="${P[key]}"></div>`;}
const TABS={fiber:{ctrls:()=>slider('reach','Fiber length (m)',0,100,1)+slider('Rb','Modulation baud (Gbaud)',1,12,0.5)+slider('fibNA','Fiber NA',0.05,0.5,0.01)+slider('fbAlpha','Profile alpha (2 = parabolic, 99 = step)',1.5,99,0.05)+slider('fbCoreR','Core radius (um)',5,40,1)+slider('fbClad','Cladding thickness (um)',1,40,1)+slider('fbLam','Wavelength (nm)',400,1600,10)+slider('th50','Launch half-angle at 50% (deg; 90 = overfilled)',2,90,0.5),
  render(){const el=view();
    if(!el._init){el.innerHTML='';const _WC=366;
      el._fp=mkCanvas('fbp',236,_WC);el._ff=mkCanvas('fbf',236,_WC);el._fb=mkCanvas('fbb',236,_WC);el._fm=mkCanvas('fbm',236,_WC);
      const _g1=document.createElement('div');_g1.className='fgrid';_g1.append(el._fp,el._ff);
      const _g2=document.createElement('div');_g2.className='fgrid';_g2.append(el._fb,el._fm);
      el.append(_g1,_g2);el._it=mkCanvas('fbisi',150);el.append(el._it);
      el.insertAdjacentHTML('beforeend','<div class="metrics" id="mfb"></div><p class="note">Meridional ray model in a power-law profile n(r)=nco*sqrt(1-2*Delta*(r/a)^alpha), cladding index fixed at 1.457 (fused silica). Rays are launched uniformly in solid angle up to the acceptance angle and integrated exactly, so the delay histogram is computed, not assumed. Mode count uses the generalized RP-Photonics rule M = (pi/lam^2) * integral (n^2 - ncl^2) dA over the core, counting both polarizations. The ISI-tap chart is the sampled pulse response of a 1-UI rectangular pulse through the delay kernel: each tap is the launch-weighted delay mass in one unit-interval bin. The sampling phase is scanned across one UI and set where the main cursor is largest - the eye centre a clock-recovery loop would lock near - rather than at the mean delay, which mis-centres asymmetric kernels. A centered modal kernel splits its ISI symmetrically into pre- and post-cursor mass; energy beyond \u00b13 UI is reported separately. Skew rays and profile dispersion (alpha_opt drifting with wavelength) are NOT modeled, so the alpha minimum here sits slightly below 2 and the parabolic case is optimistic.</p>');
      el._init=1;}
    const NCL=1.457, C0=299792458;
    const alpha=P.fbAlpha, aR=P.fbCoreR*1e-6, clad=P.fbClad, NA=P.fibNA, lam=P.fbLam*1e-9, L=P.reach;
    const nco=Math.sqrt(NCL*NCL+NA*NA), DEL=(nco*nco-NCL*NCL)/(2*nco*nco);
    const nOf=u=>nco*Math.sqrt(Math.max(1-2*DEL*Math.pow(Math.min(u,1),alpha),NCL*NCL/(nco*nco)));
    /* ---- ray delay per unit length ---- */
    const delayOf=th=>{const beta=nco*Math.cos(th);
      const s=(1-Math.pow(beta/nco,2))/(2*DEL);
      if(s<=0)return nco/C0;
      const rt=Math.pow(s,1/alpha);
      if(rt>1)return null;
      let Lz=0,Tt=0,N=420;
      for(let i=0;i<N;i++){const r=(i+0.5)/N*rt,n=nOf(r),num=n*n-beta*beta;
        if(num<=0)continue;const dr=rt/N;
        Lz+=beta/Math.sqrt(num)*dr;Tt+=n*n/(C0*Math.sqrt(num))*dr;}
      return Lz>0?Tt/Lz:nco/C0;};
    const thMax=Math.asin(Math.min(NA/nco,0.999)), NR=220, rays=[];
    for(let i=0;i<NR;i++){const th=(i+0.5)/NR*thMax,t=delayOf(th);
      if(t!==null){const _t5=(P.th50===undefined?5.5:P.th50),_sg=(_t5*Math.PI/180)/1.17741;
        rays.push({th,w:Math.sin(th)*Math.cos(th)*((_t5>=90)?1:Math.exp(-(th*th)/(2*_sg*_sg))),t});}}
    const W=rays.reduce((s,r)=>s+r.w,0);
    const tmin=Math.min(...rays.map(r=>r.t)),tmax=Math.max(...rays.map(r=>r.t));
    const mean=rays.reduce((s,r)=>s+r.w*r.t,0)/W;
    const rms=Math.sqrt(rays.reduce((s,r)=>s+r.w*(r.t-mean)*(r.t-mean),0)/W);
    const spreadPs=(tmax-tmin)*1e12*L, rmsPs=rms*1e12*L;
    const Hm=fG=>{let re=0,im=0;for(const r of rays){const ph=-2*Math.PI*fG*1e9*(r.t-mean)*L;re+=r.w*Math.cos(ph);im+=r.w*Math.sin(ph);}return Math.hypot(re,im)/W;};
    let lo=1e-4,hi=5e4;for(let k=0;k<60;k++){const mid=Math.sqrt(lo*hi);if(Hm(mid)>Math.SQRT1_2)lo=mid;else hi=mid;}
    const bw3=Math.sqrt(lo*hi);
    /* ---- mode count: M = (pi/lam^2) * int (n^2 - ncl^2) dA, both polarizations ---- */
    let integ=0;const NI=600;
    for(let i=0;i<NI;i++){const u=(i+0.5)/NI,r=u*aR,n=nOf(u);integ+=(n*n-NCL*NCL)*2*Math.PI*r*(aR/NI);}
    const M1pol=Math.max(0,Math.round(Math.PI/(lam*lam)*integ));const Mmodes=M1pol*2;
    const V=2*Math.PI/lam*aR*NA;
    const _n2=r=>{const u=r/aR;if(u>=1)return NCL*NCL;return nco*nco*(1-2*DEL*Math.pow(u,alpha));};
    const kk=2*Math.PI/lam;
    const _inCore=(l,beta,N)=>{
      const dr=aR/N,psi=new Float64Array(N+1);
      let p=(l===0)?1:Math.pow(dr,l), dp=(l===0)?0:l*Math.pow(dr,l-1);
      psi[1]=p;
      const f=(r,p,dp)=>-dp/r-(kk*kk*_n2(r)-beta*beta-(l*l)/(r*r))*p;
      for(let i=1;i<N;i++){const ri=i*dr;
        const a1=dp,b1=f(ri,p,dp);
        const a2=dp+0.5*dr*b1,b2=f(ri+0.5*dr,p+0.5*dr*a1,dp+0.5*dr*b1);
        const a3=dp+0.5*dr*b2,b3=f(ri+0.5*dr,p+0.5*dr*a2,dp+0.5*dr*b2);
        const a4=dp+dr*b3,b4=f(ri+dr,p+dr*a3,dp+dr*b3);
        p+=dr/6*(a1+2*a2+2*a3+a4);dp+=dr/6*(b1+2*b2+2*b3+b4);
        if(Math.abs(p)>1e120){const sc=1e-120;p*=sc;dp*=sc;for(let q=0;q<=i;q++)psi[q]*=sc;}
        psi[i+1]=p;}
      return {psi,p,dp,dr,N,D:dp/p};};
    const _cladD=(l,beta,NC=500)=>{
      const g2=beta*beta-kk*kk*NCL*NCL; if(g2<=0)return null;
      const gam=Math.sqrt(g2), rOut=aR+Math.max(9/gam,aR*0.4);
      let p=1,dp=-(gam+0.5/rOut),r=rOut;
      const h=-(rOut-aR)/NC;
      const f=(r,p,dp)=>-dp/r+(gam*gam+(l*l)/(r*r))*p;
      for(let i=0;i<NC;i++){
        const a1=dp,b1=f(r,p,dp);
        const a2=dp+0.5*h*b1,b2=f(r+0.5*h,p+0.5*h*a1,dp+0.5*h*b1);
        const a3=dp+0.5*h*b2,b3=f(r+0.5*h,p+0.5*h*a2,dp+0.5*h*b2);
        const a4=dp+h*b3,b4=f(r+h,p+h*a3,dp+h*b3);
        p+=h/6*(a1+2*a2+2*a3+a4);dp+=h/6*(b1+2*b2+2*b3+b4);r+=h;
        if(Math.abs(p)>1e120){const sc=1e-120;p*=sc;dp*=sc;}}
      return {D:dp/p,gam,p,dp};};
    const _corePsi=(l,beta,N,co)=>{
      const dr=aR/N;
      const Q=r=>kk*kk*_n2(r)-beta*beta-(l*l)/(r*r);
      let rt=aR;
      for(let i=N;i>=1;i--){const r=i*dr;if(Q(r)>0){rt=r;break;}}
      const f=(r,p,dp)=>-dp/r-Q(r)*p;
      const step=(r,p,dp,h)=>{
        const a1=dp,b1=f(r,p,dp);
        const a2=dp+0.5*h*b1,b2=f(r+0.5*h,p+0.5*h*a1,dp+0.5*h*b1);
        const a3=dp+0.5*h*b2,b3=f(r+0.5*h,p+0.5*h*a2,dp+0.5*h*b2);
        const a4=dp+h*b3,b4=f(r+h,p+h*a3,dp+h*b3);
        return [p+h/6*(a1+2*a2+2*a3+a4), dp+h/6*(b1+2*b2+2*b3+b4)];};
      const psi=new Float64Array(N+1);
      /* outward 0 -> rt : oscillatory region, stable */
      let p=(l===0)?1:Math.pow(dr,l), dp=(l===0)?0:l*Math.pow(dr,l-1);
      psi[0]=(l===0)?1:0;psi[1]=p;
      let iT=Math.max(1,Math.min(N,Math.round(rt/dr)));
      for(let i=1;i<iT;i++){const r=i*dr;const o=step(r,p,dp,dr);p=o[0];dp=o[1];psi[i+1]=p;}
      const pOut=p;
      if(iT<N){
        /* inward aR -> rt : evanescent region, the decaying-outward branch is the
           growing-inward one, so integrating backwards is the stable direction */
        let q=co.p, dq=co.dp;
        const tmp=new Float64Array(N+1);tmp[N]=q;
        for(let i=N;i>iT;i--){const r=i*dr;const o=step(r,q,dq,-dr);q=o[0];dq=o[1];tmp[i-1]=q;}
        const sc=(Math.abs(q)>1e-300)?(pOut/q):0;
        for(let i=iT;i<=N;i++)psi[i]=tmp[i]*sc;
      }
      let mx=0;for(let i=0;i<=N;i++)mx=Math.max(mx,Math.abs(psi[i]));
      if(mx>0)for(let i=0;i<=N;i++)psi[i]/=mx;
      return {psi,N,dr,rt};};
    const _mism=(l,beta,N)=>{const co=_cladD(l,beta);if(!co)return null;
      const ci=_inCore(l,beta,N);
      /* normalized Wronskian: bounded, zero exactly at a mode, no poles (log-derivative has poles) */
      const s1=Math.hypot(ci.p,ci.dp*aR)||1, s2=Math.hypot(co.p,co.dp*aR)||1;
      const v=(ci.p/s1)*(co.dp*aR/s2)-(ci.dp*aR/s1)*(co.p/s2);
      return isFinite(v)?{v,ci,co}:null;};
    const _findMode=(l,mWant,coarse)=>{
      const N=coarse?300:Math.max(500,Math.min(1200,Math.round(aR/(lam/(12*nco)))));
      const bmax=kk*nco*(1-1e-13),bmin=kk*NCL*(1+1e-10),NS=coarse?180:420;
      let prev=null,prevB=null,found=0;
      for(let i=0;i<=NS;i++){
        const beta=bmax-(bmax-bmin)*i/NS,r=_mism(l,beta,N);
        if(!r){prev=null;continue;}
        if(prev!==null&&((r.v>0)!==(prev>0))){
          found++;
          if(found===mWant){let lo=prevB,hi=beta,flo=prev;
            for(let q=0;q<60;q++){const mid=0.5*(lo+hi),rm=_mism(l,mid,N);if(!rm)break;
              if((rm.v>0)===(flo>0)){lo=mid;flo=rm.v;}else hi=mid;}
            const bb=0.5*(lo+hi),rr=_mism(l,bb,N);
            if(!rr)return null;
            /* build psi(r) on a plotting grid: core from integration, cladding = decaying tail */
            const rmaxP=aR*1.5,NP=520,rr_=new Float64Array(NP),pp=new Float64Array(NP);
            const _cp=_corePsi(l,bb,N,rr.co);
            const pa=_cp.psi[_cp.N];
            for(let q=0;q<NP;q++){const r=(q+0.5)/NP*rmaxP;rr_[q]=r;
              if(r<=aR){const idx=Math.min(_cp.N,Math.round(r/_cp.dr));pp[q]=_cp.psi[idx];}
              else pp[q]=pa*Math.exp(-rr.co.gam*(r-aR))*Math.sqrt(aR/r);}
            let mx=0;for(let q=0;q<NP;q++)mx=Math.max(mx,Math.abs(pp[q]));
            if(mx>0)for(let q=0;q<NP;q++)pp[q]/=mx;
            return {beta:bb,neff:bb/kk,r:rr_,psi:pp,NP,rmaxP,gam:rr.co.gam};}}
        prev=r.v;prevB=beta;}
      return null;};
    const _J=(n,x)=>{if(x<0)return(n%2===0)?_J(n,-x):-_J(n,-x);
      if(x<14){let s=0,ft=1,fn=1;for(let q=1;q<=n;q++)fn*=q;
        for(let k2=0;k2<40;k2++){if(k2>0){ft*=k2;fn*=(k2+n);}
          const t=Math.pow(-1,k2)/(ft*fn)*Math.pow(x/2,2*k2+n);s+=t;if(Math.abs(t)<1e-17)break;}
        return s;}
      return Math.sqrt(2/(Math.PI*x))*Math.cos(x-n*Math.PI/2-Math.PI/4);};
    const _farField=(l,md,NTH=150)=>{const thM=Math.min(Math.asin(Math.min(NA*2.5,0.95)),0.6),out=[];
      const dr=md.rmaxP/md.NP;
      for(let j=0;j<NTH;j++){const th=(j+0.5)/NTH*thM,kt=kk*Math.sin(th);let acc=0;
        for(let i=0;i<md.NP;i++)acc+=md.psi[i]*_J(l,kt*md.r[i])*md.r[i]*dr;
        out.push({th,amp:acc});}
      return {ff:out,thM};};
    const _hiKey=NA.toFixed(4)+'|'+alpha.toFixed(2)+'|'+aR.toFixed(9)+'|'+lam.toFixed(12);
    if(!globalThis._hiCache)globalThis._hiCache={};
    let _hi=globalThis._hiCache[_hiKey];
    if(_hi===undefined){
      let lTry=Math.max(1,Math.floor(V-1.9*Math.cbrt(Math.max(V,1))));
      _hi=null;
      for(let q=0;q<14&&lTry>=1;q++){const m=_findMode(lTry,1,true);
        if(m){const full=_findMode(lTry,1);_hi={l:lTry,md:full||m};break;}
        lTry=Math.max(1,Math.floor(lTry*0.82));}
      globalThis._hiCache[_hiKey]=_hi;
    }
    const mL=_hi?_hi.l:1, mM=1;
    if(!globalThis._m0Cache)globalThis._m0Cache={};
    let md0=globalThis._m0Cache[_hiKey];
    if(md0===undefined){md0=_findMode(0,1);globalThis._m0Cache[_hiKey]=md0;}
    const mdX=_hi?_hi.md:null;
    const thNA=Math.asin(Math.min(NA,0.95));
    const _pwrBeyond=(l,md)=>{const F=_farField(l,md);let tot=0,out=0;
      for(const p of F.ff){const I=p.amp*p.amp*Math.sin(p.th);tot+=I;if(p.th>thNA)out+=I;}
      return {frac:tot>0?out/tot:0,F};};
    if(!globalThis._ffCache)globalThis._ffCache={};
    const _ffKey=_hiKey+'|'+NA.toFixed(4);
    let _ffc=globalThis._ffCache[_ffKey];
    if(_ffc===undefined){_ffc={a:md0?_pwrBeyond(0,md0):null,b:mdX?_pwrBeyond(mL,mdX):null};globalThis._ffCache[_ffKey]=_ffc;}
    const r0=_ffc.a, rX=_ffc.b;
    const _X=42,_W=306,_Y=34;
    /* ---- panel 1: index profile ---- */
    {const g=el._fp.getContext('2d');clear(g,el._fp);
     g.fillStyle='#e6edf3';g.font='bold 12px system-ui';
     g.fillText('1 \u00b7 Index profile n(r)',12,15);
     g.fillStyle='#8b98ac';g.font='9px system-ui';
     g.fillText('core radius '+P.fbCoreR+' um, cladding '+clad+' um, alpha '+(alpha>=90?'step':alpha.toFixed(2)),12,27);
     const X=_X,Y=_Y+10,Wd=_W,Ht=140;g.strokeStyle='#25324e';g.strokeRect(X,Y,Wd,Ht);
     const rTot=P.fbCoreR+clad, nmin=NCL-0.002, nmax=nco+0.002;
     const px=r=>X+Wd/2+(r/rTot)*(Wd/2), py=n=>Y+Ht-((n-nmin)/(nmax-nmin))*(Ht-8)-4;
     g.fillStyle='rgba(88,166,255,0.08)';g.fillRect(px(-P.fbCoreR),Y,px(P.fbCoreR)-px(-P.fbCoreR),Ht);
     g.strokeStyle='#3fb950';g.lineWidth=1.8;g.beginPath();
     for(let i=0;i<=400;i++){const r=-rTot+i/400*2*rTot,ar=Math.abs(r);
       const n=(ar<=P.fbCoreR)?nOf(ar/P.fbCoreR):NCL;const Xp=px(r),Yp=py(n);
       if(i===0)g.moveTo(Xp,Yp);else g.lineTo(Xp,Yp);}
     g.stroke();
     g.strokeStyle='#4a5878';g.setLineDash([3,3]);g.beginPath();g.moveTo(X,py(NCL));g.lineTo(X+Wd,py(NCL));g.stroke();g.setLineDash([]);
     g.fillStyle='#8b98ac';g.font='9px system-ui';
     g.fillText('n_cl '+NCL.toFixed(3),X+3,py(NCL)-3);
     g.fillText('n_co '+nco.toFixed(4),X+3,py(nco)+11);
     g.fillText('-'+rTot,X,Y+Ht+12);g.fillText('0',X+Wd/2-2,Y+Ht+12);g.fillText(rTot+' um',X+Wd-30,Y+Ht+12);
     g.fillStyle='#e5c07b';
     g.fillText('Delta '+(DEL*100).toFixed(3)+'%   V '+V.toFixed(1)+'   modes ~'+Mmodes+' (both pol.)',X,Y+Ht+26);
}

    /* ---- panel 2: far-field intensity maps (LP01 and highest-order) ---- */
    {const g=el._ff.getContext('2d');clear(g,el._ff);
     g.fillStyle='#e6edf3';g.font='bold 12px system-ui';
     g.fillText('2 \u00b7 Far-field intensity',12,15);
     g.fillStyle='#8b98ac';g.font='9px system-ui';
     g.fillText('fundamental LP01 vs highest-order LP'+mL+',1 \u2014 circle marks the NA limit',12,27);
     const AMAX=14, MS=138, y0=42, x1=30, x2=x1+MS+30;
     /* colour ramp: dark blue -> cyan -> green -> yellow -> red (RP-like) */
     const ramp=v=>{v=Math.max(0,Math.min(1,v));
       const st=[[0.00,8,12,60],[0.18,20,80,180],[0.38,40,190,190],[0.58,90,210,90],[0.78,245,215,70],[1.00,220,50,40]];
       for(let i=1;i<st.length;i++){if(v<=st[i][0]||i===st.length-1){
         const a=st[i-1],b=st[i],t=(v-a[0])/((b[0]-a[0])||1);
         return [a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t, a[3]+(b[3]-a[3])*t];}}
       return [220,50,40];};
     const drawMap=(R,l,ox,label)=>{
       g.strokeStyle='#25324e';g.strokeRect(ox,y0,MS,MS);
       if(!R){g.fillStyle='#66748c';g.font='9px system-ui';g.fillText('not guided',ox+MS/2-24,y0+MS/2);return;}
       const ff=R.F.ff, thMaxRad=AMAX*Math.PI/180;
       const amp=t=>{ if(t>=ff[ff.length-1].th) return 0;
         const q=t/ff[ff.length-1].th*(ff.length-1), i0=Math.floor(q), fr=q-i0;
         const a=ff[Math.min(i0,ff.length-1)].amp, b=ff[Math.min(i0+1,ff.length-1)].amp;
         return a+(b-a)*fr; };
       if(!globalThis._mapCache)globalThis._mapCache={};
       const _mk=_ffKey+'|'+l+'|'+MS+'|'+AMAX;
       if(globalThis._mapCache[_mk]){g.drawImage(globalThis._mapCache[_mk],ox,y0,MS,MS);}else{
       const _off=document.createElement('canvas');_off.width=MS;_off.height=MS;
       const _oc=_off.getContext('2d');
       const img=_oc.createImageData(MS,MS), d=img.data;
       let mx=0; const buf=new Float64Array(MS*MS);
       const SS=3;
       for(let py=0;py<MS;py++)for(let px=0;px<MS;px++){
         let acc=0,nIn=0;
         for(let sy=0;sy<SS;sy++)for(let sx=0;sx<SS;sx++){
           const ax=(((px+(sx+0.5)/SS)/MS)*2-1)*AMAX, ay=(1-((py+(sy+0.5)/SS)/MS)*2)*AMAX;
           const th=Math.hypot(ax,ay)*Math.PI/180;
           if(th>thMaxRad)continue;
           const phi=Math.atan2(ay,ax), A=amp(th);
           acc+=A*A*(l===0?1:Math.pow(Math.cos(l*phi),2));nIn++;}
         if(nIn===0){buf[py*MS+px]=-1;continue;}
         const I=acc/(SS*SS);
         buf[py*MS+px]=I; if(I>mx)mx=I;}
       for(let i=0;i<MS*MS;i++){
         const v=buf[i];const o=i*4;
         if(v<0){d[o]=10;d[o+1]=17;d[o+2]=35;d[o+3]=255;continue;}
         const c=ramp(mx>0?Math.sqrt(v/mx):0);
         d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=255;}
       _oc.putImageData(img,0,0);
       g.drawImage(_off,ox,y0,MS,MS);globalThis._mapCache[_mk]=_off;}
       /* NA circle */
       const rNA=(thNA*180/Math.PI)/AMAX*(MS/2);
       g.strokeStyle='rgba(255,255,255,0.85)';g.lineWidth=1.2;
       g.beginPath();g.arc(ox+MS/2,y0+MS/2,Math.min(rNA,MS/2),0,2*Math.PI);g.stroke();
       g.strokeStyle='#25324e';g.lineWidth=1;g.strokeRect(ox,y0,MS,MS);
       g.fillStyle='#ffffff';g.font='bold 10px system-ui';g.fillText(label,ox+3,y0-4);
       g.fillStyle='#e5c07b';g.font='bold 9px system-ui';
       g.fillText((R.frac*100).toFixed(1)+'% past NA',ox+3,y0+MS+11);};
     drawMap(r0,0,x1,'LP01');
     drawMap(rX,mL,x2,'LP'+mL+',1');
     g.fillStyle='#8b98ac';g.font='9px system-ui';
     g.fillStyle='#66748c';
     g.fillText('-'+AMAX,x1-4,y0+MS+22);g.fillText('+'+AMAX+'\u00b0',x1+MS-14,y0+MS+22);
     g.fillText('-'+AMAX,x2-4,y0+MS+22);g.fillText('+'+AMAX+'\u00b0',x2+MS-14,y0+MS+22);
     g.save();g.translate(14,y0+MS/2+18);g.rotate(-Math.PI/2);
     g.fillText('y angle',0,0);g.restore();
     g.fillStyle='#8b98ac';
     g.fillText('x angle  \u2014  white circle = NA limit '+(thNA*180/Math.PI).toFixed(1)+'\u00b0'+(mL>6?'   ('+(2*mL)+' azimuthal lobes)':''),x1,y0+MS+33);}

    /* ---- panel 3: modal transfer function ---- */
    {const g=el._fb.getContext('2d');clear(g,el._fb);
     g.fillStyle='#e6edf3';g.font='bold 12px system-ui';
     g.fillText('3 \u00b7 Modal transfer |H(f)| over '+L+' m',12,15);
     g.fillStyle='#8b98ac';g.font='9px system-ui';
     g.fillText('from the ray delays, launch-weighted \u2014 3 dB at '+(bw3<1?(bw3*1000).toFixed(0)+' MHz':bw3.toFixed(2)+' GHz'),12,27);
     const X=_X,Y=_Y+10,Wd=_W,Ht=140;g.strokeStyle='#25324e';g.strokeRect(X,Y,Wd,Ht);
     const fmx=Math.max(bw3*4,0.5),dbB=-30;
     const yD=db=>Y+(0-Math.max(dbB,Math.min(0,db)))/(0-dbB)*Ht;
     for(let db=0;db>=dbB;db-=5){const Yy=yD(db);
       g.strokeStyle=(db%10===0)?'#31405f':'#232f47';g.lineWidth=1;
       g.beginPath();g.moveTo(X,Yy);g.lineTo(X+Wd,Yy);g.stroke();
       if(db%10===0&&db!==0){g.fillStyle='#8b98ac';g.font='9px system-ui';g.fillText(String(db),X-22,Yy+3);}}
     g.fillStyle='#8b98ac';g.font='9px system-ui';g.fillText('0 dB',X-26,yD(0)+9);
     {const _raw=fmx/7,_pow=Math.pow(10,Math.floor(Math.log10(_raw)));
      const _m=_raw/_pow,st=_pow*(_m<1.5?1:(_m<3.5?2:(_m<7.5?5:10)));
      for(let fG=st;fG<fmx;fG+=st){const Xp=X+(fG/fmx)*Wd;
        g.strokeStyle='#232f47';g.beginPath();g.moveTo(Xp,Y);g.lineTo(Xp,Y+Ht);g.stroke();
        if(fG<0.88*fmx){g.fillStyle='#66748c';g.fillText(String(Math.round(fG*100)/100),Xp-5,Y+Ht+12);}}}
     {const y3=yD(-3);g.strokeStyle='#ef4444';g.setLineDash([2,3]);
      g.beginPath();g.moveTo(X,y3);g.lineTo(X+Wd,y3);g.stroke();g.setLineDash([]);
      g.fillStyle='#ef4444';g.fillText('-3',X+Wd+2,y3+3);}
     g.strokeStyle='#e5c07b';g.lineWidth=1.6;g.beginPath();
     for(let q=0;q<=160;q++){const fG=q/160*fmx,db=20*Math.log10(Math.max(Hm(fG),1e-4));
       const Xp=X+q/160*Wd,Yp=yD(db);if(q===0)g.moveTo(Xp,Yp);else g.lineTo(Xp,Yp);}
     g.stroke();
     g.strokeStyle='#25324e';g.lineWidth=1;g.strokeRect(X,Y,Wd,Ht);
     g.fillStyle='#8b98ac';g.fillText('0',X-3,Y+Ht+12);g.fillText('GHz',X+Wd-18,Y+Ht+12);
     g.fillStyle='#e5c07b';g.fillText('BW x length = '+(bw3*L).toFixed(1)+' GHz\u00b7m',X,Y+Ht+26);}

    /* ---- panel 4: radial mode intensity ---- */
    {const g=el._fm.getContext('2d');clear(g,el._fm);
     g.fillStyle='#e6edf3';g.font='bold 12px system-ui';
     g.fillText('4 \u00b7 Radial mode intensity |psi(r)|\u00b2',12,15);
     g.fillStyle='#8b98ac';g.font='9px system-ui';
     g.fillText('LP01 (n_eff '+(md0?md0.neff.toFixed(5):'-')+')  vs  LP'+mL+',1 (n_eff '+(mdX?mdX.neff.toFixed(5):'not guided')+')',12,27);
     const X=_X,Y=_Y+10,Wd=_W,Ht=140;g.strokeStyle='#25324e';g.strokeRect(X,Y,Wd,Ht);
     const rmaxP=aR*1.5, px=r=>X+(r/rmaxP)*Wd;
     g.fillStyle='rgba(88,166,255,0.08)';g.fillRect(X,Y,px(aR)-X,Ht);
     const draw=(md,col)=>{if(!md)return;
       g.strokeStyle=col;g.lineWidth=1.6;g.beginPath();
       for(let i=0;i<md.NP;i++){const I=md.psi[i]*md.psi[i], Xp=px(md.r[i]), Yp=Y+Ht-4-I*(Ht-12);
         if(i===0)g.moveTo(Xp,Yp);else g.lineTo(Xp,Yp);}
       g.stroke();};
     draw(md0,'#3fb950');draw(mdX,'#e5c07b');
     g.strokeStyle='#4a5878';g.setLineDash([3,3]);g.beginPath();g.moveTo(px(aR),Y);g.lineTo(px(aR),Y+Ht);g.stroke();g.setLineDash([]);
     g.fillStyle='#8b98ac';g.font='9px system-ui';
     g.fillText('0',X-3,Y+Ht+12);g.fillText('core edge',px(aR)-24,Y+Ht+12);
     g.fillText((rmaxP*1e6).toFixed(0)+' um',X+Wd-30,Y+Ht+12);
     g.fillStyle='#3fb950';g.fillText('LP01',X,Y+Ht+26);
     g.fillStyle='#e5c07b';g.fillText('LP'+mL+',1 (highest order)',X+52,Y+Ht+26);
     g.fillStyle='#8b98ac';g.fillText('near-cutoff mode hugs the edge',X+178,Y+Ht+26);}

    {/* ---- ISI taps of the unequalized fiber-only channel ----
     Taps = sampled pulse response of a 1-UI rectangular pulse through the delay kernel:
     p(kUI+t0) = weighted delay mass in ((k-0.5)UI, (k+0.5)UI) around sampling phase t0.
     t0 is chosen to maximize the main cursor (the decision phase a CDR would lock near),
     scanned over one UI - NOT simply the mean delay, which mis-centres asymmetric kernels. */
     const UIps=1000/Math.max(P.Rb,0.1);
     const binsAt=t0=>{const b=[0,0,0,0,0,0,0];let out=0;
       for(const r of rays){const dps=(r.t-mean)*1e12*L-t0;const k=Math.round(dps/UIps);
         if(k>=-3&&k<=3)b[k+3]+=r.w;else out+=r.w;}
       return {b,out};};
     let t0=0,bestC=-1;
     for(let q=-20;q<=20;q++){const tt=q/40*UIps;const m0=binsAt(tt).b[3];if(m0>bestC){bestC=m0;t0=tt;}}
     const _bb=binsAt(t0), taps=_bb.b.map(v=>v/W), resid=_bb.out/W;
     const h0=Math.max(taps[3],1e-9);
     const g=el._it.getContext('2d');clear(g,el._it);
     g.fillStyle='#8bb7f0';g.font='bold 12px system-ui';
     g.fillText('ISI taps at the decision point (unequalized fiber channel, 1-UI pulse; sampling phase = eye centre, '+t0.toFixed(0)+' ps from mean delay)',12,15);
     const X=46,Y=26,Wd=el._it._w-90,Ht=el._it._h-56,bw=Wd/8;
     g.strokeStyle='#25324e';g.strokeRect(X,Y,Wd,Ht);
     const lbl=['h-3','h-2','h-1','h+0','h+1','h+2','h+3'];
     for(let q=0;q<7;q++){const v=taps[q]/h0,xx=X+bw*(q+0.55);
       const hh=Math.min(1,v)*(Ht-6);
       g.fillStyle=(q===3)?'#3fb950':(q<3?'#e879c9':'#e5c07b');
       g.fillRect(xx,Y+Ht-hh-3,bw*0.72,hh);
       g.fillStyle='#cbd5e1';g.font='10px system-ui';
       if(v>0.001)g.fillText((100*v).toFixed(v<0.095?1:0)+'%',xx,Y+Ht-hh-7);
       g.fillStyle='#8b98ac';g.fillText(lbl[q],xx+bw*0.12,Y+Ht+13);}
     g.fillStyle='#e879c9';g.font='10px system-ui';g.fillText('pre-cursor',X+Wd-150,Y+12);
     g.fillStyle='#e5c07b';g.fillText('post-cursor',X+Wd-80,Y+12);
     const preS=taps[0]+taps[1]+taps[2],postS=taps[4]+taps[5]+taps[6];
     g.fillStyle='#8b98ac';g.fillText('pre '+(100*preS).toFixed(1)+'%   post '+(100*postS).toFixed(1)+'%   beyond \u00b13 UI '+(100*resid).toFixed(1)+'%   (of total pulse energy)',X,Y+Ht+26);}
    document.getElementById('mfb').innerHTML=
      met('modal spread',spreadPs.toFixed(spreadPs<10?2:1)+' ps ('+(spreadPs/L).toFixed(spreadPs/L<1?3:1)+' ps/m)')+
      met('modal rms',rmsPs.toFixed(rmsPs<10?2:1)+' ps')+
      met('modal 3dB BW',(bw3<1?(bw3*1000).toFixed(0)+' MHz':bw3.toFixed(2)+' GHz')+' @'+L+'m')+
      met('BW x length',(bw3*L).toFixed(1)+' GHz\u00b7m')+
      met('guided modes',M1pol+' (1 pol., RP convention) / '+Mmodes+' both pol.   V = '+V.toFixed(1))+
      met('vs step-index',(alpha>=90?'this IS step':((45.0/(spreadPs/L)).toFixed(1)+'x better')))+
      met('spread @1 UI',(1000/Math.max(P.Rb,0.1)).toFixed(0)+' ps UI -> '+(spreadPs/(1000/Math.max(P.Rb,0.1))).toFixed(2)+' UI at '+P.Rb+' Gbaud')+met('what the link uses','the full h(t) kernel is convolved - spread and rms are descriptors only')+met('LP01 n_eff',md0?md0.neff.toFixed(5):'-')+met('LP'+mL+','+mM,(mdX?('n_eff '+mdX.neff.toFixed(5)):'not guided'))+met('power past NA','LP01 '+(r0?(r0.frac*100).toFixed(1):'-')+'%   LP'+mL+mM+' '+(rX?(rX.frac*100).toFixed(1)+'%':'-'));}
  }};

let cur='fiber',_raf=0;
function view(){return document.getElementById('view');}
function schedule(){if(_raf)return;_raf=requestAnimationFrame(()=>{_raf=0;try{TABS[cur].render();}catch(e){view().innerHTML='<p style="color:#ef4444">Render error: '+e.message+'</p>';}});}
function build(){document.getElementById('ctrls').innerHTML='<h3>Controls</h3><div class="ctlgrid">'+TABS[cur].ctrls()+'</div>';
  document.querySelectorAll('input[type=range]').forEach(inp=>{const key=inp.id.slice(2);inp.addEventListener('input',()=>{P[key]=parseFloat(inp.value);const lab=document.getElementById('v_'+key);if(lab)lab.textContent=inp.value;schedule();});});
  schedule();}
build();
</script>
</body></html>
